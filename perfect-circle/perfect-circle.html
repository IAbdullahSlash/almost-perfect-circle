<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Perfect Circle Challenge</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #09090b; /* Zinc 950 */
            color: white;
            overflow: hidden;
            touch-action: none;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            touch-action: none;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        /* Shake animation for wrong password */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const PerfectCircleGame = () => {
            // Configuration
            const MAX_ATTEMPTS = 3;
            const RESET_PIN = "9283";

            // State
            const [gameState, setGameState] = useState('intro'); // intro, playing, scored, summary, auth
            const [attempts, setAttempts] = useState([]);
            const [currentScore, setCurrentScore] = useState(null);
            const [message, setMessage] = useState('');
            const [isDrawing, setIsDrawing] = useState(false);
            
            // Auth State
            const [password, setPassword] = useState('');
            const [authError, setAuthError] = useState(false);
            
            // Refs
            const canvasRef = useRef(null);
            const ctxRef = useRef(null);
            const pointsRef = useRef([]);
            const centerRef = useRef({ x: 0, y: 0 });

            // Initialize Canvas
            useEffect(() => {
                const handleResize = () => {
                    const canvas = canvasRef.current;
                    if (canvas) {
                        canvas.width = window.innerWidth;
                        canvas.height = window.innerHeight;
                        ctxRef.current = canvas.getContext('2d');
                        centerRef.current = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
                        resetCanvas();
                    }
                };

                window.addEventListener('resize', handleResize);
                handleResize(); // Initial setup

                return () => window.removeEventListener('resize', handleResize);
            }, [gameState]); // Re-run when game state changes to ensure clean slate

            // Helper to clear and draw the center dot
            const resetCanvas = () => {
                const canvas = canvasRef.current;
                const ctx = ctxRef.current;
                if (!canvas || !ctx) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw center dot
                const { x, y } = centerRef.current;
                ctx.beginPath();
                ctx.arc(x, y, 6, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
            };

            // --- Game Logic ---

            const startGame = () => {
                setAttempts([]);
                setGameState('playing');
                setCurrentScore(null);
                resetCanvas();
            };

            const initiateReset = () => {
                setGameState('auth');
                setPassword('');
                setAuthError(false);
            };

            const handleAuthSubmit = () => {
                if (password === RESET_PIN) {
                    startGame();
                } else {
                    setAuthError(true);
                    setPassword('');
                    // Reset error animation state after it runs
                    setTimeout(() => setAuthError(false), 500);
                }
            };

            const nextRound = () => {
                resetCanvas();
                setCurrentScore(null);
                if (attempts.length >= MAX_ATTEMPTS) {
                    setGameState('summary');
                } else {
                    setGameState('playing');
                }
            };

            const getPos = (e) => {
                const touch = e.touches ? e.touches[0] : e;
                return { x: touch.clientX, y: touch.clientY };
            };

            const startDrawing = (e) => {
                if (gameState !== 'playing') return;
                
                setIsDrawing(true);
                pointsRef.current = [];
                resetCanvas(); // Clear previous drawing if any
                
                const { x, y } = getPos(e);
                pointsRef.current.push({ x, y });
                
                const ctx = ctxRef.current;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineCap = 'round';
                ctx.lineWidth = 4;
                ctx.strokeStyle = 'white';
            };

            const draw = (e) => {
                if (!isDrawing || gameState !== 'playing') return;
                
                const { x, y } = getPos(e);
                pointsRef.current.push({ x, y });
                
                const ctx = ctxRef.current;
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const endDrawing = () => {
                if (!isDrawing || gameState !== 'playing') return;
                setIsDrawing(false);

                const points = pointsRef.current;
                
                // Minimum points check
                if (points.length < 20) {
                    resetCanvas();
                    return;
                }

                calculateScore(points);
            };

            const calculateScore = (points) => {
                const { x: cx, y: cy } = centerRef.current;

                // 1. Calculate Distances (Radii) from center
                const distances = points.map(p => Math.hypot(p.x - cx, p.y - cy));

                // 2. Average Radius
                const avgRadius = distances.reduce((a, b) => a + b, 0) / distances.length;

                // 3. Minimum radius check (prevent drawing a tiny dot)
                if (avgRadius < 50) {
                    resetCanvas();
                    return;
                }

                // 4. Calculate Deviation (Variance)
                const totalDeviation = distances.reduce((acc, dist) => acc + Math.abs(dist - avgRadius), 0);
                const avgDeviation = totalDeviation / distances.length;

                // 5. Gap Check (Did they close the circle?)
                const start = points[0];
                const end = points[points.length - 1];
                const gap = Math.hypot(start.x - end.x, start.y - end.y);
                
                // 6. Score Formula
                // Base score is percentage of deviation relative to the radius
                let rawScore = 100 * (1 - (avgDeviation / avgRadius));
                
                // Penalty for gap
                if (gap > avgRadius * 0.5) {
                    rawScore -= (gap / avgRadius) * 20;
                }

                // Clamp score
                let score = Math.max(0, Math.min(100, rawScore));
                score = parseFloat(score.toFixed(1));

                // Determine Color & Message
                let color = '#ef4444'; // Red
                let msg = 'Keep Trying';
                
                if (score >= 98) { color = '#a855f7'; msg = 'UNREAL!'; }      // Purple
                else if (score >= 94) { color = '#3b82f6'; msg = 'Legendary'; } // Blue
                else if (score >= 90) { color = '#22c55e'; msg = 'Awesome'; }   // Green
                else if (score >= 80) { color = '#eab308'; msg = 'Good Job'; }  // Yellow
                else if (score >= 60) { color = '#f97316'; msg = 'Not Bad'; }   // Orange

                // Visual Feedback on Canvas
                const ctx = ctxRef.current;
                ctx.strokeStyle = color;
                ctx.lineWidth = 6;
                ctx.stroke();

                // Update State
                const newAttempts = [...attempts, { score, color }];
                setAttempts(newAttempts);
                setCurrentScore({ val: score, color });
                setMessage(msg);
                
                setGameState('scored');
            };

            // Icons
            const PlayIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>;
            const RotateIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"></path><path d="M3 3v9h9"></path></svg>;
            const LockIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;

            return (
                <div className="relative w-full h-screen overflow-hidden bg-zinc-950 select-none">
                    
                    {/* HUD - Always visible except Intro/Auth */}
                    {gameState !== 'intro' && gameState !== 'summary' && gameState !== 'auth' && (
                        <div className="absolute top-8 left-0 w-full flex justify-center pointer-events-none z-10">
                            <div className="bg-zinc-900/80 backdrop-blur border border-zinc-800 px-6 py-2 rounded-full text-zinc-300 font-mono text-lg font-bold shadow-lg">
                                {attempts.length + (gameState === 'scored' ? 0 : 1)} / {MAX_ATTEMPTS}
                            </div>
                        </div>
                    )}

                    {/* Intro Screen */}
                    {gameState === 'intro' && (
                        <div className="absolute inset-0 flex flex-col items-center justify-center z-20 bg-black/60 backdrop-blur-sm animate-fade-in">
                            <div className="mb-8 relative">
                                <div className="w-48 h-48 border-4 border-dashed border-zinc-700 rounded-full animate-[spin_10s_linear_infinite]"></div>
                                <div className="absolute inset-0 flex items-center justify-center">
                                    <div className="w-3 h-3 bg-white rounded-full shadow-[0_0_20px_white]"></div>
                                </div>
                            </div>
                            <h1 className="text-4xl font-black text-white mb-2 tracking-tight">Perfect Circle</h1>
                            <p className="text-zinc-400 mb-8">Can you draw it perfectly?</p>
                            
                            <button 
                                onClick={startGame}
                                className="group relative bg-white hover:bg-zinc-200 text-black text-lg font-bold py-4 px-10 rounded-full transition-all active:scale-95 flex items-center gap-3"
                            >
                                <PlayIcon />
                                Start Challenge
                            </button>
                        </div>
                    )}

                    {/* Scored State Overlay */}
                    {gameState === 'scored' && currentScore && (
                        <div 
                            className="absolute inset-0 flex flex-col items-center justify-center z-20 cursor-pointer"
                            onClick={nextRound}
                        >
                            <div className="animate-pop flex flex-col items-center">
                                <h1 
                                    className="text-8xl font-black drop-shadow-2xl mb-2"
                                    style={{ 
                                        color: currentScore.color,
                                        textShadow: `0 0 40px ${currentScore.color}50`
                                    }}
                                >
                                    {currentScore.val}%
                                </h1>
                                <p className="text-2xl font-bold text-white uppercase tracking-widest opacity-90 mb-12">
                                    {message}
                                </p>
                                <div className="text-zinc-500 text-sm animate-bounce mt-8">
                                    Tap anywhere to continue
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Summary Modal */}
                    {gameState === 'summary' && (
                        <div className="absolute inset-0 flex items-center justify-center z-30 bg-black/80 backdrop-blur-md p-4 animate-fade-in">
                            <div className="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-md p-8 shadow-2xl transform transition-all animate-pop">
                                <h2 className="text-3xl font-black text-center mb-1 text-white">Results</h2>
                                <p className="text-center text-zinc-500 mb-8 text-sm">Session Complete</p>
                                
                                <div className="space-y-3 mb-8">
                                    {attempts.map((attempt, idx) => (
                                        <div key={idx} className="flex justify-between items-center p-4 bg-zinc-950 rounded-xl border border-zinc-800/50">
                                            <span className="text-zinc-400 font-medium">Attempt {idx + 1}</span>
                                            <span 
                                                className="text-2xl font-bold" 
                                                style={{ color: attempt.color }}
                                            >
                                                {attempt.score}%
                                            </span>
                                        </div>
                                    ))}
                                </div>

                                <div className="border-t border-zinc-800 pt-6">
                                    <div className="flex justify-between items-center mb-6 px-2">
                                        <span className="text-zinc-400">Average</span>
                                        <span className="text-xl font-bold text-white">
                                            {(attempts.reduce((a, b) => a + b.score, 0) / attempts.length).toFixed(1)}%
                                        </span>
                                    </div>
                                    
                                    <button 
                                        onClick={initiateReset}
                                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl transition-all active:scale-95 flex items-center justify-center gap-2"
                                    >
                                        <RotateIcon />
                                        Play Again
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Authentication/Password Modal */}
                    {gameState === 'auth' && (
                        <div className="absolute inset-0 flex items-center justify-center z-40 bg-black/90 backdrop-blur-lg p-4 animate-fade-in">
                            <div className={`bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-xs p-8 shadow-2xl transform transition-all animate-pop ${authError ? 'animate-shake' : ''}`}>
                                <div className="flex justify-center mb-6 text-zinc-500">
                                    <LockIcon />
                                </div>
                                <h2 className="text-xl font-bold text-center mb-2 text-white">Reset Game</h2>
                                <p className="text-center text-zinc-500 mb-6 text-sm">Enter PIN to start new session</p>
                                
                                <input 
                                    type="password"
                                    inputMode="numeric" 
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className={`w-full bg-black border ${authError ? 'border-red-500' : 'border-zinc-700'} text-white text-center text-3xl font-mono py-3 rounded-xl mb-6 focus:outline-none focus:border-blue-500 transition-colors tracking-widest placeholder-zinc-800`}
                                    placeholder="••••"
                                    maxLength={4}
                                />
                                
                                <button 
                                    onClick={handleAuthSubmit}
                                    className="w-full bg-white hover:bg-zinc-200 text-black font-bold py-3 rounded-xl transition-all active:scale-95 mb-3"
                                >
                                    Unlock
                                </button>
                                <button 
                                    onClick={() => setGameState('summary')}
                                    className="w-full text-zinc-500 hover:text-white font-medium py-2 text-sm transition-colors"
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Canvas Area */}
                    <canvas 
                        ref={canvasRef}
                        onMouseDown={startDrawing}
                        onMouseMove={draw}
                        onMouseUp={endDrawing}
                        onMouseLeave={endDrawing}
                        onTouchStart={startDrawing}
                        onTouchMove={draw}
                        onTouchEnd={endDrawing}
                        className="block w-full h-full cursor-crosshair active:cursor-none"
                    />
                    
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PerfectCircleGame />);
    </script>
</body>
</html>
